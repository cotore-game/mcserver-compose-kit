name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install --yes shellcheck zip unzip

      - name: Run checks
        run: |
          bash -n mcserver-kit new-minecraft-server.sh setup.sh reset.sh install.sh uninstall.sh tests/run-tests.sh
          python3 -m py_compile scripts/detect-world-version.py scripts/validate-locales.py
          python3 scripts/validate-locales.py
          shellcheck -x mcserver-kit new-minecraft-server.sh setup.sh reset.sh install.sh uninstall.sh tests/run-tests.sh
          bash tests/run-tests.sh

      - name: Build release archive
        run: |
          mkdir -p dist/mcserver-compose-kit
          cp -a \
            new-minecraft-server.sh \
            mcserver-kit \
            setup.sh \
            reset.sh \
            install.sh \
            uninstall.sh \
            config.example.yml \
            compose-example.yaml \
            README.md \
            LICENSE \
            scripts \
            locales \
            mcid-templates \
            dist/mcserver-compose-kit/
          tar -C dist -czf dist/mcserver-compose-kit.tar.gz mcserver-compose-kit
          cd dist
          sha256sum mcserver-compose-kit.tar.gz > mcserver-compose-kit.tar.gz.sha256

      - name: Upload release archive for inspection
        uses: actions/upload-artifact@v4
        with:
          name: mcserver-compose-kit-release
          path: |
            dist/mcserver-compose-kit.tar.gz
            dist/mcserver-compose-kit.tar.gz.sha256

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/mcserver-compose-kit.tar.gz \
            dist/mcserver-compose-kit.tar.gz.sha256 \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
