name: Shell tests

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install --yes shellcheck zip unzip

      - name: Check Bash syntax
        run: bash -n mcserver-kit install.sh libexec/mcserver-kit/*.sh tests/run-tests.sh

      - name: Check Python syntax
        run: python3 -m py_compile libexec/mcserver-kit/*.py scripts/validate-locales.py

      - name: Validate locale catalogs
        run: python3 scripts/validate-locales.py share/mcserver-kit/locales

      - name: Run ShellCheck
        run: shellcheck -x mcserver-kit install.sh libexec/mcserver-kit/*.sh tests/run-tests.sh

      - name: Run specification tests
        run: bash tests/run-tests.sh
